<template>
    <lightning-card title="New Round Robin Tracker">
        <div class="slds-m-around_medium">
            <!-- Display error message if errorMessage is defined -->
            <template if:true={errorMessage}>
                <div class="slds-theme_error">
                    <p class="slds-text-color_inverse">{errorMessage}</p>
                </div>
            </template>

            <lightning-combobox 
                label="Current Assignee" 
                value={currentAssignee} 
                placeholder="Select Assignee"
                options={userOptions} 
                onchange={handleInputChange} 
                data-id="currentAssignee">
            </lightning-combobox>
            
            <lightning-button 
                variant="brand" 
                label="Save" 
                onclick={handleSave}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
